
name: Build and Push Ecommerce Backend Images

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: ecommerceacr.azurecr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login "$ACR_LOGIN_SERVER" \
            --username "${{ secrets.ACR_USERNAME }}" \
            --password-stdin

      - name: Build AuthAPI
        run: |
          docker build -f AuthAPI/Dockerfile \
            -t "$ACR_LOGIN_SERVER/authapi:$GITHUB_SHA" .
          docker push "$ACR_LOGIN_SERVER/authapi:$GITHUB_SHA"

      - name: Build ProductsAPI
        run: |
          docker build -f ProductsAPI/Dockerfile \
            -t "$ACR_LOGIN_SERVER/productsapi:$GITHUB_SHA" .
          docker push "$ACR_LOGIN_SERVER/productsapi:$GITHUB_SHA"

      - name: Build CartAPI
        run: |
          docker build -f CartAPI/Dockerfile \
            -t "$ACR_LOGIN_SERVER/cartapi:$GITHUB_SHA" .
          docker push "$ACR_LOGIN_SERVER/cartapi:$GITHUB_SHA"

      - name: Build OrdersAPI
        run: |
          docker build -f OrdersAPI/Dockerfile \
            -t "$ACR_LOGIN_SERVER/ordersapi:$GITHUB_SHA" .
          docker push "$ACR_LOGIN_SERVER/ordersapi:$GITHUB_SHA"

      - name: Build GatewayEcom
        run: |
          docker build -f GatewayEcom/Dockerfile \
            -t "$ACR_LOGIN_SERVER/gatewayecom:$GITHUB_SHA" .
          docker push "$ACR_LOGIN_SERVER/gatewayecom:$GITHUB_SHA"

      - name: Logout from registry
        if: always()
        run: docker logout "$ACR_LOGIN_SERVER"
